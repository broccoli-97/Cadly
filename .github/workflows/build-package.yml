# Reusable build + test + package pipeline, called by ci.yml (every push/PR)
# and release.yml (tags and manual runs). Keeping it in one place means the
# artifacts a release ships are byte-for-byte the same recipe CI exercises
# continuously — no second, quietly-drifting copy of the packaging steps.
#
# Three build flavors, matching the supported dependency strategies:
#   - Linux: system Qt6 + OCCT from apt (the primary dev configuration), then
#     bundled with their runtime closure into a portable tarball.
#     Pinned to ubuntu-24.04 (Qt 6.4, OCCT 7.6) so a runner-image bump can't
#     silently change the toolchain the way `ubuntu-latest` would.
#   - Windows: MSYS2 UCRT64 binary packages (Qt6 + OCCT), built with GCC
#     and Ninja, deployed with windeployqt and CMake's runtime DLL scanner.
#   - macOS: Homebrew Qt + OCCT on the Apple Silicon runner, deployed into a
#     self-contained ad-hoc-signed Cadly.app via packaging/macos/package-app.sh
#     and shipped as a .dmg (unsigned-developer distribution: users right-click
#     -> Open on first launch; notarization would need a Developer ID secret).
#
# Packages land as workflow artifacts (Actions tab -> run -> Artifacts) under
# the names `cadly-linux-x64`, `cadly-windows-x64`, and `cadly-macos-arm64`.

name: Build & package

on:
  workflow_call:
    inputs:
      linux-presets:
        description: 'JSON array of Linux presets to build (debug adds coverage, not artifacts)'
        type: string
        default: '["linux-debug", "linux-release"]'

jobs:
  linux:
    name: Linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(inputs.linux-presets) }}
    steps:
      - uses: actions/checkout@v7

      # libtbb-dev + libfontconfig-dev: OCCT's exported CMake targets
      # (INTERFACE_LINK_LIBRARIES) reference /usr/lib/x86_64-linux-gnu/
      # libtbb{,malloc}.so by absolute path and fontconfig by bare -l name,
      # but the libocct-*-dev packages only depend on the *runtime* libs
      # (libtbb12, libfontconfig1), not on the -dev packages that own the
      # .so linker symlinks. Without them the build fails at link (ninja:
      # "libtbb.so ... missing and no known rule", ld: "cannot find
      # -lfontconfig"). Every other external token in those targets
      # (freetype, freeimage, GL, X11) is covered transitively via
      # libocct-visualization-dev.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            qt6-base-dev qt6-svg-dev qt6-wayland \
            libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-data-exchange-dev \
            libocct-ocaf-dev \
            libtbb-dev libfontconfig-dev \
            libglm-dev libfmt-dev libspdlog-dev \
            libgl1-mesa-dev \
            patchelf

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # Enforce the input module's no-Qt/no-camera dependency boundary even
      # when the regular application build has all GUI dependencies available.
      - name: Test input without the GUI
        run: |
          cmake -S . -B build/input-headless -G Ninja \
            -DCADLY_BUILD_GUI=OFF -DCADLY_BUILD_CLI=OFF \
            -DCADLY_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/input-headless --target \
            cadly_navigation_scheme_test cadly_pointer_router_test
          ctest --test-dir build/input-headless --output-on-failure \
            -R '^cadly_(navigation_scheme|pointer_router)$'

      # End-to-end import check on a real STEP assembly — exercises the OCCT
      # reader + tessellation without needing a GL context or display.
      - name: Import smoke check (STEP)
        run: ./build/${{ matrix.preset }}/bin/cad_import_cli test_files/as1-ug-214.stp

      - name: Package
        if: matrix.preset == 'linux-release'
        run: |
          packaging/linux/package-portable.sh \
            build/${{ matrix.preset }} stage/cadly
          # Exercise both entry points through the packaged RPATH/plugin
          # layout. --help exits before the GUI needs a display or GL context.
          QT_QPA_PLATFORM=offscreen ./stage/cadly/bin/cadly --help >/dev/null
          ./stage/cadly/bin/cad_import_cli \
            stage/cadly/sample-files/as1-ug-214.stp
          # Tar before upload: artifact zips don't preserve the exec bit.
          tar -czf cadly-linux-x64.tar.gz -C stage cadly

      - name: Upload package artifact
        if: matrix.preset == 'linux-release'
        uses: actions/upload-artifact@v7
        with:
          name: cadly-linux-x64
          path: cadly-linux-x64.tar.gz
          if-no-files-found: error

  macos:
    name: macOS (macos-release)
    # macos-14 = Apple Silicon. Homebrew supplies current Qt + OCCT as
    # bottles (the macOS analogue of the Linux apt path — minutes, not the
    # hours a vcpkg source build costs).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install Homebrew dependencies
        run: scripts/setup-macos.sh

      - name: Configure
        run: cmake --preset macos-release

      - name: Build
        run: cmake --build --preset macos-release

      - name: Test
        run: ctest --preset macos-release

      - name: Import smoke check (STEP)
        run: ./build/macos-release/bin/cad_import_cli test_files/as1-ug-214.stp

      - name: Package
        run: |
          packaging/macos/package-app.sh build/macos-release stage/cadly-macos
          # Exercise both entry points through the deployed bundle (the
          # script already ran cad_import_cli in place; --help exits before
          # a display or GL context is needed).
          QT_QPA_PLATFORM=offscreen \
            ./stage/cadly-macos/Cadly.app/Contents/MacOS/cadly --help >/dev/null
          ./stage/cadly-macos/Cadly.app/Contents/MacOS/cad_import_cli \
            stage/cadly-macos/sample-files/as1-ug-214.stp
          hdiutil create -volname Cadly -srcfolder stage/cadly-macos \
            -ov -format UDZO cadly-macos-arm64.dmg

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: cadly-macos-arm64
          path: cadly-macos-arm64.dmg
          if-no-files-found: error

  windows:
    name: Windows (windows-msys2-release)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: false

      - name: Install prebuilt dependencies
        run: bash scripts/setup-windows.sh

      - name: Configure
        run: cmake --preset windows-msys2-release

      - name: Build
        run: cmake --build --preset windows-msys2-release

      - name: Test
        timeout-minutes: 10
        run: ctest --preset windows-msys2-release --verbose

      - name: Import smoke check (STEP)
        run: ./build/windows-msys2-release/bin/cad_import_cli.exe test_files/as1-ug-214.stp

      - name: Package
        run: |
          cmake -DBUILD_DIR=build/windows-msys2-release -DPACKAGE_DIR=package/cadly \
            -P packaging/windows/package-portable.cmake

      - name: Test standalone package
        timeout-minutes: 5
        shell: pwsh
        run: |
          # Exclude the development environment so it cannot hide missing DLLs.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = 'offscreen'
          # A Windows GUI executable otherwise shows --help in a modal dialog.
          $env:QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES = '1'
          $gui = Start-Process -FilePath "package/cadly/bin/cadly.exe" -ArgumentList '--help' -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw "packaged cadly failed ($($gui.ExitCode))" }
          & "package/cadly/bin/cad_import_cli.exe" package/cadly/sample-files/as1-ug-214.stp
          if ($LASTEXITCODE -ne 0) { throw "packaged cad_import_cli failed ($LASTEXITCODE)" }

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: cadly-windows-x64
          path: package
          if-no-files-found: error
