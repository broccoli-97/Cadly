# CI: on every push to main and every pull request, run the full build +
# test + package pipeline on Linux, Windows, and macOS. The packaging steps
# live in build-package.yml, which release.yml calls with the same inputs — so a
# release ships exactly what CI has been exercising all along.
#
# Packages land as workflow artifacts (Actions tab -> run -> Artifacts).
# Publishing to the Releases page is release.yml's job, on `v*` tags.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-package.yml
    permissions:
      contents: read
