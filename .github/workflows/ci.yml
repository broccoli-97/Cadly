# CI: on every push to main and every pull request, run the full build +
# test + package pipeline on Linux and Windows. The packaging steps live in
# build-package.yml, which release.yml calls with the same inputs — so a
# release ships exactly what CI has been exercising all along.
#
# Packages land as workflow artifacts (Actions tab -> run -> Artifacts).
# Publishing to the Releases page is release.yml's job, on `v*` tags.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A cold Windows vcpkg build can take hours. Let a PR's running build
  # finish and publish its binaries; keep only the newest pending update.
  # Main pushes and manual runs still replace an obsolete running build.
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-package.yml
    permissions:
      contents: read
      packages: write
